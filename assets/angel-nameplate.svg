<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Naufal Shidqi Purnomo — Angel System Unit 01</title>
  <desc id="desc">Animated navy and cyan identity nameplate with an angel insignia, online indicator, circuit trace, and restrained light sweep.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071528"/>
      <stop offset="0.52" stop-color="#091b31"/>
      <stop offset="1" stop-color="#040c18"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0ea5e9" stop-opacity="0.2"/>
      <stop offset="0.3" stop-color="#bae6fd"/>
      <stop offset="0.72" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f0f9ff"/>
      <stop offset="0.55" stop-color="#d8f3ff"/>
      <stop offset="1" stop-color="#8ddcff"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="nameClip"><rect x="252" y="60" width="735" height="70"/></clipPath>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#38bdf8" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <style>
    .frame { animation: trace 5.5s ease-in-out infinite; }
    .sweep { animation: sweep 6s ease-in-out infinite; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    .node { animation: node 4.2s linear infinite; }
    .orbit { transform-origin: 116px 110px; animation: orbit 12s linear infinite; }
    @keyframes trace { 0%,100% { stroke-dashoffset: 1780; opacity:.55 } 45%,75% { stroke-dashoffset:0; opacity:1 } }
    @keyframes sweep { 0%,22% { transform:translateX(-720px); opacity:0 } 30% { opacity:1 } 53%,100% { transform:translateX(800px); opacity:0 } }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    @keyframes node { from { stroke-dashoffset:215 } to { stroke-dashoffset:-215 } }
    @keyframes orbit { to { transform:rotate(360deg) } }
    @media (prefers-reduced-motion: reduce) { .frame,.sweep,.pulse,.node,.orbit { animation:none !important } .frame { stroke-dashoffset:0;opacity:1 } .sweep { opacity:0 } }
  </style>

  <path d="M28 18H1128L1178 67V178L1148 202H72L22 160V55Z" fill="url(#panel)"/>
  <path d="M42 32H1118L1164 76V169L1137 188H79L36 152V63Z" fill="url(#grid)" stroke="#38bdf8" stroke-opacity="0.16"/>
  <path d="M28 18H1128L1178 67V178L1148 202H72L22 160V55Z" fill="none" stroke="#082f49" stroke-width="8" opacity="0.8"/>
  <path class="frame" d="M28 18H1128L1178 67V178L1148 202H72L22 160V55Z" fill="none" stroke="url(#edge)" stroke-width="2" stroke-dasharray="1780" stroke-dashoffset="1780"/>
  <path d="M22 55V160L72 202H245" fill="none" stroke="#7dd3fc" stroke-width="4" opacity="0.72"/>
  <path d="M1128 18L1178 67V110" fill="none" stroke="#e0f2fe" stroke-width="4"/>
  <path d="M955 33H1116L1147 64" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.65"/>

  <!-- Angel / wing sigil -->
  <g transform="translate(116 110)">
    <circle r="66" fill="#03101f" stroke="#164e63"/>
    <circle class="orbit" r="54" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="38 15 4 18" opacity="0.7"/>
    <path d="M0-31L10-12L0 2L-10-12ZM0 2L13 18L0 36L-13 18Z" fill="#bae6fd" filter="url(#glow)"/>
    <path d="M-13-4C-29-19-46-17-54-8C-39-8-30 1-21 19L-7 8ZM13-4C29-19 46-17 54-8C39-8 30 1 21 19L7 8Z" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="bevel"/>
    <path d="M-49 9L-25 32L-10 20M49 9L25 32L10 20" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.7"/>
    <circle r="3" fill="#e0f2fe"/>
  </g>
  <path d="M185 73H218L232 87V145L218 159H185" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.7"/>
  <path d="M204 77V142" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 8" opacity="0.55"/>

  <!-- Identity -->
  <text x="252" y="54" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="4">IDENTITY // AUTHORIZED</text>
  <text x="252" y="117" fill="url(#nameFill)" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="800" letter-spacing="2.2">NAUFAL SHIDQI PURNOMO</text>
  <g clip-path="url(#nameClip)"><rect class="sweep" x="252" y="57" width="190" height="72" fill="url(#sweep)" transform="skewX(-15)"/></g>
  <path d="M252 136H889" stroke="#164e63"/>
  <path d="M252 136H557" stroke="#38bdf8" stroke-width="2"/>
  <text x="252" y="165" fill="#7dd3fc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="4.5">ANGEL SYSTEM // UNIT 01</text>

  <!-- Status module -->
  <g transform="translate(1006 73)">
    <path d="M0 0H128L147 19V74L128 93H0L-13 80V13Z" fill="#061525" stroke="#164e63"/>
    <path d="M0 0H128L147 19" fill="none" stroke="#38bdf8"/>
    <circle class="pulse" cx="16" cy="30" r="6" fill="#67e8f9" filter="url(#glow)"/>
    <text x="32" y="35" fill="#bae6fd" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">ONLINE</text>
    <text x="16" y="64" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="2">LINK STABLE</text>
    <path d="M16 76H123" stroke="#164e63" stroke-width="2"/>
    <path class="node" d="M16 76H123" stroke="#67e8f9" stroke-width="2" stroke-dasharray="7 100"/>
  </g>

  <!-- Circuit bridge -->
  <path d="M886 136H920L934 150H975" fill="none" stroke="#164e63" stroke-width="2"/>
  <path class="node" d="M886 136H920L934 150H975" fill="none" stroke="#67e8f9" stroke-width="2" stroke-dasharray="6 105"/>
  <circle cx="975" cy="150" r="3" fill="#7dd3fc"/>
  <path d="M70 188H335M865 188H1136" stroke="#0ea5e9" stroke-width="1" opacity="0.35"/>
  <path d="M335 188H865" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="2 9" opacity="0.25"/>
</svg>

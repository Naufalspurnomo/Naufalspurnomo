name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: Naufalspurnomo
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?color_snake=grey&color_dots=#c0c0c0,#e0e0e0,#5b5b5b,#8b8b8b

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
